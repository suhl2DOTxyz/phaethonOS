#
# /etc/pacman.conf (Phaethon OS ISO Build Configuration)
#
# Custom pacman.conf designed for bootstrapping and running the Phaethon OS
# rolling-release environment. It enables bleeding-edge repositories,
# high-performance kernels, multilib gaming dependencies, and our distro-specific repo.
#

[options]
# Keep pacman and systemd safe during upgrades
HoldPkg     = pacman systemd
CleanMethod = KeepInstalled
Architecture = auto

# Miscellaneous visual and download performance options
UseSyslog
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 8

# Build-time only. pacman applies a low-speed cutoff to every download and
# aborts the whole transaction when a mirror stalls:
#
#   error: failed retrieving file 'goverlay-...pkg.tar.zst' from
#          fastly.mirror.pkgbuild.com : Operation too slow.
#          Less than 1 bytes/sec transferred the last 10 seconds
#   error: failed to commit transaction (download library error)
#
# That killed a CI build 60 seconds in, having already resolved every package
# -- a slow mirror, not a broken manifest. Pulling ~3 GB across hundreds of
# packages from whichever mirror a CI runner happens to land on makes this
# likely rather than rare, and restarting a 27-minute build over one stalled
# file is the expensive way to handle it.
#
# Deliberately NOT set in the installed system's pacman.conf
# (airootfs/usr/share/phaethon/pacman.conf.target): on somebody's own machine a
# download that hangs forever is worse than one that fails and can be retried.
# The installer's own pacman calls already set this via packages_online.conf.
DisableDownloadTimeout

# Signature verification security parameters
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# ==============================================================================
# PHAETHON OS DISTRO CUSTOM REPOSITORY
# ==============================================================================
# Contains custom themes, artworks, scripts, and the custom Welcome app.
# Disabled until packages are built with phaethon-repo/build-repo.sh
#[phaethon]
#SigLevel = Optional TrustAll
#Server = file:///home/suhl2/Documents/PhaethonOS/phaethon-repo/x86_64

# ==============================================================================
# CACHYOS REPOSITORIES (HIGH-PERFORMANCE PACKAGES & KERNELS)
# ==============================================================================
# Leverages performance-oriented CPU optimizations and custom kernel schedules (BORE+EEVDF).
[cachyos]
SigLevel = Optional TrustAll
Server = https://mirror.cachyos.org/repo/$arch/$repo

# ==============================================================================
# STANDARD PHAETHONOS REPOSITORIES
# ==============================================================================
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# ==============================================================================
# MULTILIB REPOSITORY (REQUIRED FOR WINE / STEAM GAMING)
# ==============================================================================
[multilib]
Include = /etc/pacman.d/mirrorlist
