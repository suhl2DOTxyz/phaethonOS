#
# Configures the display manager in the target and enables it.
#
# This module CONFIGURES a display manager, it does not install one -- sddm
# comes from packagechooser@desktop (both desktop options include it).
---
# A single-entry list on purpose: PhaethonOS is Plasma on SDDM, and the
# branding, SDDM drop-ins and phaethon-init.sh theming all assume it.
displaymanagers:
    - sddm

defaultDesktopEnvironment:
    executable: "startplasma-wayland"
    desktopFile: "plasma"

# Leave sddm's own packaged defaults in place and only set the autologin
# session/user. basicSetup rewrites the config wholesale, which would clobber
# the /etc/sddm.conf.d drop-ins that carry the PhaethonOS theming.
basicSetup: false

# openSUSE-specific (/etc/sysconfig); meaningless on Arch.
sysconfigSetup: false

sddm:
    configuration_file: "/etc/sddm.conf"
