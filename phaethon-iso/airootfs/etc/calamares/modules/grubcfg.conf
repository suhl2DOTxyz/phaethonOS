#
# Writes /etc/default/grub in the target. Runs BEFORE the `bootloader` module,
# which is what then runs grub-mkconfig and turns these settings into
# /boot/grub/grub.cfg.
---
# Do not blow away the whole file -- other lines pacman's grub package ships
# are worth keeping.
overwrite: false

# ...but DO apply everything under `defaults` even though /etc/default/grub
# already exists (pacstrap installs the `grub` package, so it always does).
#
# This is load-bearing: without it, the `defaults` block below is only applied
# when the file is absent, and GRUB_THEME / GRUB_TERMINAL_OUTPUT never get
# written -- which is exactly how you end up with an unthemed boot menu.
always_use_defaults: true

# Let the module derive GRUB_DISTRIBUTOR from branding.desc (PhaethonOS).
keep_distributor: false

# Write to /etc/default/grub rather than a /etc/default/grub.d drop-in;
# Arch's grub does not read the drop-in directory.
prefer_grub_d: false

# Becomes GRUB_CMDLINE_LINUX_DEFAULT. Kept in step with bootloader.conf's
# kernelParams.
kernel_params:
    - quiet
    - loglevel=3

defaults:
    GRUB_TIMEOUT: 5

    # "0", not "saved". GRUB_DEFAULT=saved needs a writable grubenv, and
    # grub-editenv cannot write the environment block on btrfs -- which is the
    # PhaethonOS default filesystem (see partition.conf).
    GRUB_DEFAULT: "0"

    # --- Graphical boot menu -------------------------------------------------
    # A GRUB theme only renders on a graphical terminal. With the default
    # GRUB_TERMINAL_OUTPUT=console, grub-mkconfig emits a text-mode menu and
    # GRUB_THEME is ignored entirely.
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_GFXMODE: "auto"
    # Hand the mode straight to the kernel so there is no flicker or mode
    # change between the boot menu and early KMS.
    GRUB_GFXPAYLOAD_LINUX: "keep"

    # The PhaethonOS boot theme. shellprocess@before-online copies it into the
    # target at exactly this path, and it must already be there by the time
    # grub-mkconfig runs: 00_header only emits `set theme=` if the file exists.
    #
    # Under /boot rather than /usr/share so the theme sits on the same
    # filesystem as grub.cfg and GRUB can always read it.
    GRUB_THEME: "/boot/grub/themes/phaethon/theme.txt"

    # A themed menu with submenus collapses to a near-empty list, and the
    # recovery entries are noise on a rolling release.
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: true

    # os-prober is in the package manifest and is worth having: since GRUB
    # 2.06 it does nothing unless this is explicitly false, which is why
    # dual-boot entries silently go missing on a lot of Arch derivatives.
    GRUB_DISABLE_OS_PROBER: false
