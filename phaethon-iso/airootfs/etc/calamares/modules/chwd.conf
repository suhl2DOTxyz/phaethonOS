#
# chwd -- CachyOS Hardware Detection.
#
# This is not an upstream Calamares module; it is added by the
# `cachyos-calamares` package, and it detects the machine's GPU and installs
# the matching driver packages into the target. It runs between `localecfg` and
# `packages@online` in the exec sequence, so the drivers it selects are pulled
# in by the same online transaction as everything else.
#
# IMPORTANT: the module ships no public configuration schema, and unlike every
# other module referenced from settings.conf its source is not part of upstream
# Calamares. Its documented behaviour is to auto-detect, which needs no
# settings; this file exists so the module has a configuration to load rather
# than logging a missing-configuration warning.
#
# If a future cachyos-calamares grows real options for chwd, add them here --
# check `/usr/lib/calamares/modules/chwd/` on the live ISO for the module's own
# module.desc and any bundled example configuration.
---
