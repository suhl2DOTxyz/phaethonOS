#
# Writes /etc/fstab (and /etc/crypttab) in the target.
---
crypttabOptions: luks

tmpOptions:
    # On a spinning disk, leave /tmp on disk -- a tmpfs /tmp costs RAM that a
    # machine old enough to still have a HDD tends not to have spare.
    default:
        tmpfs: false
        options: ""
    # On an SSD, a tmpfs /tmp is faster and avoids pointless writes.
    ssd:
        tmpfs: true
        options: "defaults,noatime,mode=1777"
