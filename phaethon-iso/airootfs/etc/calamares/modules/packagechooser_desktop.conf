#
# packagechooser@desktop -- "which desktop?" page.
#
# `method: packages` here (unlike the bootloader instance): the selected item's
# `packages` list is pushed onto Global Storage's packageOperations, and
# packages@online installs it into the target later in the exec sequence.
#
# Both options are KDE Plasma on SDDM -- that is what PhaethonOS is, and what
# the branding, the SDDM drop-ins and the phaethon-init.sh theming all assume.
# The choice is how much of the desktop comes along, not which desktop.
#
# sddm is in both lists on purpose: the `displaymanager` module configures a
# display manager, it does not install one.
---
mode: required
method: packages

default: plasma-full

labels:
    step: "Desktop"

items:
    - id: plasma-full
      name: "KDE Plasma (recommended)"
      description: "The full PhaethonOS desktop: Plasma on Wayland with SDDM, the standard KDE applications, and the portal and theming integration the PhaethonOS look depends on."
      screenshot: "/usr/share/calamares/branding/phaethon/phaethon-logo.png"
      packages:
        - plasma-desktop
        - plasma-wayland-protocols
        - kwin
        - sddm
        - sddm-kcm
        - systemsettings
        - plasma-nm
        - plasma-pa
        - plasma-systemmonitor
        - powerdevil
        - xdg-desktop-portal-kde
        - xdg-user-dirs
        - xdg-utils
        - konsole
        - dolphin
        - dolphin-plugins
        - ark
        - kcalc
        - spectacle
        - gwenview
        - okular
        - qt6-wayland

    - id: plasma-minimal
      name: "KDE Plasma (minimal)"
      description: "Plasma, SDDM, a file manager and a terminal, and nothing else. Leaves you to install the rest yourself -- a smaller download and a smaller install."
      screenshot: "/usr/share/calamares/branding/phaethon/phaethon-logo.png"
      packages:
        - plasma-desktop
        - plasma-wayland-protocols
        - kwin
        - sddm
        - systemsettings
        - plasma-nm
        - plasma-pa
        - powerdevil
        - xdg-desktop-portal-kde
        - xdg-user-dirs
        - xdg-utils
        - konsole
        - dolphin
        - qt6-wayland
