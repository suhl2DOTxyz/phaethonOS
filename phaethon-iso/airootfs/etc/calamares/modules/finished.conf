#
# The last page, shown once the exec sequence has completed.
---
# Offer to reboot, but leave the box unticked: people frequently want to poke
# at the live session, copy the install log, or read the summary before the
# machine restarts under them.
restartNowMode: user-unchecked

# -i so a still-running live session (Plasma, the welcome app) cannot veto the
# reboot with an inhibitor.
restartNowCommand: "systemctl -i reboot"

notifyOnFinished: false
