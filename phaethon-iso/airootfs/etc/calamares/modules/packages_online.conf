#
# packages@online -- installs everything that was selected earlier in the
# sequence into the target system.
#
# This module does not carry the package list itself. It consumes the
# `packageOperations` entries that earlier modules pushed into Global Storage:
#
#   * netinstall            -> the group checkboxes on the "Package selection" page
#   * packagechooser@desktop -> the desktop chosen on the "Desktop" page
#                               (that instance uses `method: packages`)
#
# The bootloader chooser deliberately uses `method: legacy` instead, so it
# writes a Global Storage *value* rather than packages -- see
# packagechooser_bootloader.conf and bootloader.conf.
---
backend: pacman

# The welcome page already made internet a hard requirement; if we got this far
# and the network died, failing loudly beats silently shipping a broken system.
skip_if_no_internet: false

update_db: true
update_system: false

pacman:
    # Mirrors occasionally hiccup mid-transaction; retrying beats aborting an
    # install that is already 20 minutes deep.
    num_retries: 3
    disable_download_timeout: true
    needed_only: true

operations:
    # Live-ISO-only machinery must never survive onto the installed system.
    # `try_remove` is a no-op when the package was never installed.
    - try_remove:
        - mkinitcpio-archiso
