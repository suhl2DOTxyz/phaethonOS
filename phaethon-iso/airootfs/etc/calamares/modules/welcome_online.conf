#
# welcome@online -- the first page of the installer.
#
# This is the "online" instance: PhaethonOS installs with `pacstrap` +
# `packages@online`, i.e. every single package is pulled from the network at
# install time. There is no offline/squashfs fallback, so a working internet
# connection is a hard requirement, not a warning.
---
showSupportUrl:      true
showKnownIssuesUrl:  true
showReleaseNotesUrl: true
showDonateUrl:       false

requirements:
    # The package manifest (see phaethon-iso/packages.x86_64) pulls in Plasma,
    # LibreOffice, Steam, VS Code and the CachyOS kernel. ~25 GiB is the
    # realistic floor for a complete install plus a little breathing room.
    requiredStorage:  25.0

    # Plasma + Calamares + a live squashfs overlay in RAM.
    requiredRam:      3.5

    # Hit something that must be reachable for the install to succeed at all.
    internetCheckUrl: https://geoip.kde.org/v1/calamares

    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen

    # `internet` is required (not merely checked) because pacstrap has nothing
    # to install from without it.
    required:
        - storage
        - ram
        - root
        - internet
