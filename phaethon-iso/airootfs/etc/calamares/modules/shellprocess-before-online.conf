#
# shellprocess@before-online -- runs on the LIVE system, immediately before
# pacstrap, i.e. before anything at all exists in the target.
#
# Seeds the empty target with the three things the online install depends on:
# repository configuration, the pacman keyring, and the PhaethonOS GRUB theme.
---
dontChroot: true
timeout: 300
verbose: true

script:
    # --- Repository configuration -------------------------------------------
    # The target gets a purpose-built pacman.conf rather than a copy of the
    # ISO's: the build-time config can enable the [phaethon] repository from a
    # file:// path that exists only on the build host, and an installed system
    # pointing at a dead local repo fails every `pacman -Sy`.
    #
    # pacman treats /etc/pacman.conf as a backup file, so installing the
    # `pacman` package later leaves this alone and drops a .pacnew beside it.
    - '/usr/bin/install -d -m 0755 ${ROOT}/etc/pacman.d'
    - '/usr/bin/install -m 0644 /usr/share/phaethon/pacman.conf.target ${ROOT}/etc/pacman.conf'

    # [core]/[extra]/[multilib] Include this file, so it has to exist before
    # pacstrap runs or pacman aborts on a missing include. Not tolerant of
    # failure: without it nothing installs at all, and failing here is far
    # easier to diagnose than the pacstrap error it would otherwise cause.
    - '/usr/bin/install -m 0644 /etc/pacman.d/mirrorlist ${ROOT}/etc/pacman.d/mirrorlist'

    # Not required (the target's [cachyos] uses an explicit Server), but the
    # cachyos-mirrorlist package will want to land on top of it anyway.
    - '-/usr/bin/install -m 0644 /etc/pacman.d/cachyos-mirrorlist ${ROOT}/etc/pacman.d/cachyos-mirrorlist'

    # Reuse the keyring initialised by shellprocess@initialize_pacman instead of
    # making the target rebuild it and re-fetch keys from a keyserver. Without
    # this, SigLevel=Required in the target's pacman.conf has nothing to verify
    # signatures against.
    - '/usr/bin/cp -a /etc/pacman.d/gnupg ${ROOT}/etc/pacman.d/gnupg'

    # --- GRUB theme ---------------------------------------------------------
    # This has to happen here, and not in one of the later shellprocess steps,
    # because of ordering: grub-mkconfig's 00_header only emits `set theme=`
    # when the file named by GRUB_THEME already exists. grubcfg writes
    # GRUB_THEME into /etc/default/grub and `bootloader` then runs
    # grub-mkconfig -- both of which come after this step but before any other
    # shellprocess instance. Installing the theme any later means grub.cfg is
    # generated without it and the installed system boots to an unthemed menu.
    #
    # /boot/grub/themes rather than /usr/share/grub/themes: it puts the theme on
    # the same filesystem as grub.cfg, so GRUB can always read it even when /usr
    # lives on a filesystem or subvolume it would otherwise have to go looking
    # for.
    - '/usr/bin/install -d -m 0755 ${ROOT}/boot/grub/themes'
    - '/usr/bin/cp -aT /usr/share/grub/themes/phaethon ${ROOT}/boot/grub/themes/phaethon'

    # grub-install normally drops the unicode font into /boot/grub/fonts, but
    # the theme is unusable without it, so seed it from the live system too.
    - '-/usr/bin/install -D -m 0644 /usr/share/grub/unicode.pf2 ${ROOT}/boot/grub/fonts/unicode.pf2'
