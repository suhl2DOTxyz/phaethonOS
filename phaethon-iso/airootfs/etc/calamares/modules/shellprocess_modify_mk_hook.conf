#
# shellprocess@modify_mk_hook -- runs on the LIVE system, before pacstrap.
#
# "mk hook" = the mkinitcpio alpm hooks. Two separate problems are neutralised
# here; shellprocess@reset_mk_hook undoes the target-side half once the
# bootloader is in place.
#
# 1. The live ISO ships /etc/pacman.d/hooks/archiso-rebuild.hook, which rebuilds
#    the *live* initramfs (with the archiso hooks) whenever linux-cachyos is
#    installed or upgraded. shellprocess@initialize_pacman runs `pacman -Sy`
#    just before this, so that hook can fire during the install and burn
#    minutes of CPU and a chunk of the RAM-backed overlay for an initramfs that
#    is thrown away when the machine reboots.
#
# 2. In the target, mkinitcpio's install/remove hooks would otherwise run once
#    per kernel- or firmware-touching package during pacstrap and
#    packages@online. That is both slow and wrong: at that point initcpiocfg
#    has not written the target's /etc/mkinitcpio.conf yet, so the images being
#    generated are built from the wrong HOOKS. The `initcpio` module builds the
#    real initramfs once, later, after initcpiocfg has run.
#
# Symlinking a hook file to /dev/null is pacman's documented way of disabling
# an alpm hook shipped in /usr/share/libalpm/hooks.
---
dontChroot: true
timeout: 60
verbose: true

script:
    # (1) live side -- moved aside rather than deleted, purely so the intent is
    # obvious to anyone poking at a running live session.
    - '-/usr/bin/mv -f /etc/pacman.d/hooks/archiso-rebuild.hook /etc/pacman.d/hooks/archiso-rebuild.hook.disabled'

    # (2) target side.
    - '/usr/bin/install -d -m 0755 ${ROOT}/etc/pacman.d/hooks'
    - '/usr/bin/ln -sf /dev/null ${ROOT}/etc/pacman.d/hooks/90-mkinitcpio-install.hook'
    - '/usr/bin/ln -sf /dev/null ${ROOT}/etc/pacman.d/hooks/60-mkinitcpio-remove.hook'
