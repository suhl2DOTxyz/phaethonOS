#
# shellprocess@enable_ufw -- runs INSIDE the target, after services-systemd.
#
# Brings up a default-deny-inbound firewall on the installed system.
#
# NOTE on the instance name: settings.conf calls this instance `enable_ufw`,
# but phaethon-iso/packages.x86_64 ships firewalld, not ufw. Rather than
# silently doing nothing on every single install, this configures whichever of
# the two is actually present -- so the step keeps working if the manifest is
# switched to ufw later, and keeps working today.
#
# `ufw enable` also tries to load the rules immediately, which cannot work
# inside a chroot with no netfilter of its own. The configuration change it
# writes does persist, which is the part that matters, so each command is
# allowed to fail.
---
dontChroot: false
timeout: 120
verbose: true

script:
    - command: |
        if command -v ufw >/dev/null 2>&1; then
            echo "configuring ufw"
            ufw --force default deny incoming || true
            ufw --force default allow outgoing || true
            ufw --force enable || true
            systemctl enable ufw.service || true
        elif command -v firewall-cmd >/dev/null 2>&1; then
            echo "configuring firewalld"
            firewall-cmd --permanent --set-default-zone=public || true
            systemctl enable firewalld.service || true
        else
            echo "no supported firewall installed, skipping"
        fi
      timeout: 120
