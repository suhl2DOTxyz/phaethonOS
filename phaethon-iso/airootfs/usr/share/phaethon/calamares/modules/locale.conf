#
# Timezone and locale selection page.
---
# Fallback only -- the map defaults here, then geoip (below) moves the pin, and
# the user can drag it anywhere.
region: "America"
zone: "New_York"

geoip:
    style: "json"
    url:   "https://geoip.kde.org/v1/calamares"
    # Blank uses the default selector, which is correct for the KDE service's
    # JSON format.
    selector: ""
