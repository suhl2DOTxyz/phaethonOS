#
# Enables systemd units in the target.
#
# NOT in the original brief's list, but the exec sequence runs
# `services-systemd` and the module is a complete no-op without a
# configuration file. Most importantly that means NetworkManager is never
# enabled, and the installed system boots with no network at all.
#
# sddm is deliberately absent: the `displaymanager` module already wires up
# display-manager.service, and enabling it twice fights over the symlink.
---
units:
    # --- Networking ---------------------------------------------------------
    - name: NetworkManager.service
      action: "enable"
      mandatory: true

    # --- Firmware / hardware ------------------------------------------------
    - name: bluetooth.service
      action: "enable"
      mandatory: false

    # --- Security -----------------------------------------------------------
    # The actual default-deny rules are applied by
    # shellprocess@enable_ufw, which runs after this module.
    - name: firewalld.service
      action: "enable"
      mandatory: false

    - name: apparmor.service
      action: "enable"
      mandatory: false

    # --- Storage ------------------------------------------------------------
    # Weekly TRIM. Safe on spinning disks (it simply finds nothing to discard).
    - name: fstrim.timer
      action: "enable"
      mandatory: false

    # --- Time ---------------------------------------------------------------
    - name: systemd-timesyncd.service
      action: "enable"
      mandatory: false

    # --- CachyOS / performance ----------------------------------------------
    - name: ananicy-cpp.service
      action: "enable"
      mandatory: false

    - name: irqbalance.service
      action: "enable"
      mandatory: false

    # --- Development (only present if the Development group was selected) ----
    - name: docker.service
      action: "enable"
      mandatory: false
