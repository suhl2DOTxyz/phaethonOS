#
# Mounts the target filesystems under rootMountPoint before pacstrap, and
# defines the btrfs subvolume layout and per-filesystem mount options.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    # Required for efibootmgr to write a boot entry from inside the chroot.
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

# The @/@home layout snapshot tools (snapper, timeshift) expect on Arch.
# /var/cache and /var/log get their own subvolumes so package caches and logs
# are excluded from root snapshots.
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log

# A swap file needs a subvolume with no copy-on-write and no compression;
# Calamares creates this one with the right attributes.
btrfsSwapSubvol: /@swap

mountOptions:
    - filesystem: default
      options: [ defaults ]
    # umask=0077 keeps the ESP root-only; it is FAT and has no permissions of
    # its own, and it is world-readable otherwise.
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    # zstd:1 is the compression level CachyOS ships: nearly free on CPU, and
    # still a large win on a Plasma + games install.
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
    - filesystem: ext4
      options: [ defaults, noatime ]
    - filesystem: xfs
      options: [ defaults, noatime ]
