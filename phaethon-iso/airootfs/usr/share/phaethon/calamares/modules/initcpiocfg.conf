#
# Writes the target's /etc/mkinitcpio.conf. The `initcpio` module then runs
# mkinitcpio against it, later in the exec sequence.
#
# The HOOKS line is computed from the actual partitioning (encryption, LVM,
# btrfs, a separate /usr, resume-from-swap, ...) -- this file only nudges that
# result. MODULES/FILES/BINARIES are templated from the live system's
# /etc/mkinitcpio.conf; the archiso hooks live in
# /etc/mkinitcpio.conf.d/archiso.conf, which this module does not read, so they
# cannot leak into the installed system.
---
# The `systemd` hook would replace udev/keymap/consolefont with their sd-*
# equivalents. PhaethonOS stays on the busybox-based hooks: that is what the
# CachyOS kernel packages and their presets are tested against.
useSystemdHook: false

hooks:
    prepend: []
    append: []
    remove: []

source: "/etc/mkinitcpio.conf"
