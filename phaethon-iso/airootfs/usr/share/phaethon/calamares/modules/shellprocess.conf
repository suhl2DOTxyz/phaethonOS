# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# The bare (un-instanced) `shellprocess` step in settings.conf, which runs late
# in the exec sequence: after services-systemd, before shellprocess@enable_ufw.
#
# Final housekeeping on the freshly installed system.
#
# Most of the removals below are guards rather than fixes: `pacstrap` installs
# a fresh system rather than copying the live /etc, so on a clean run there is
# usually nothing to delete. They are cheap, and the alternative -- shipping a
# machine that grants passwordless root to anyone in `wheel` because one file
# leaked out of the live session -- is not.
#
# Every command is "-" prefixed so a failure cannot abort an otherwise complete
# install at the very last moment.
---
dontChroot: false
timeout: 300
verbose: true

script:
    # The live session grants passwordless sudo to everyone in `wheel` so the
    # installer can run unattended. The installed system must not inherit that;
    # the `users` module writes its own, password-protected sudoers rule
    # (sudoersConfigureWithGroup).
    - '-/usr/bin/rm -f /etc/sudoers.d/g_wheel'

    # Same story for the polkit rule that lets `wheel` launch Calamares without
    # authenticating, and for the live session's SDDM autologin drop-in.
    - '-/usr/bin/rm -f /etc/polkit-1/rules.d/10-calamares-nopasswd.rules'
    - '-/usr/bin/rm -f /etc/sddm.conf.d/autologin.conf'

    # Live-session units that make no sense on real hardware.
    - '-/usr/bin/rm -f /etc/systemd/system/create-live-user.service'
    - '-/usr/bin/rm -f /etc/systemd/system/multi-user.target.wants/create-live-user.service'
    - '-/usr/bin/rm -f /etc/systemd/system/choose-mirror.service'
    - '-/usr/bin/rm -f /etc/systemd/system/multi-user.target.wants/choose-mirror.service'
    - '-/usr/bin/rm -f /etc/systemd/system/phaethon-fix-libs.service'
    - '-/usr/bin/rm -f /etc/systemd/system/multi-user.target.wants/phaethon-fix-libs.service'
    - '-/usr/bin/rm -f /etc/systemd/system/phaethon-calamares-config.service'
    - '-/usr/bin/rm -f /etc/systemd/system/multi-user.target.wants/phaethon-calamares-config.service'

    # Refresh the caches pacman hooks would normally maintain, but which were
    # skipped while the alpm hooks were masked during pacstrap.
    - '-/usr/bin/update-desktop-database'
    - '-/usr/bin/fc-cache -f'
