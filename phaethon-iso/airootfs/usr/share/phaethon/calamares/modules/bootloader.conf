# SPDX-License-Identifier: CC0-1.0
#
# Installs the bootloader into the target.
---
# Read the user's choice from the Global Storage value that
# packagechooser@bootloader writes (`method: legacy` writes
# "packagechooser_" + the instance id from settings.conf).
#
# Caution when editing: if this key is set but the Global Storage value is
# missing, the module logs a warning and installs NOTHING. That is why
# packagechooser_bootloader.conf uses `mode: required` with an explicit
# `default: grub` -- so a value is always present.
efiBootLoaderVar: "packagechooser_bootloader"

# Fallback for when efiBootLoaderVar is removed above. Only consulted if
# efiBootLoaderVar is absent from this file entirely, never as a fallback for a
# missing Global Storage value.
efiBootLoader: "grub"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

# Only used when the user picks systemd-boot; GRUB gets its settings from
# /etc/default/grub via the grubcfg module.
loaderEntries:
    - "timeout 5"
    - "console-mode keep"

# Kept in step with grubcfg.conf's kernel_params.
kernelParams: [ "quiet", "loglevel=3" ]

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Also write EFI/BOOT/BOOTX64.EFI. Plenty of firmware ignores NVRAM boot
# entries, or has its variable store wiped; the fallback path is what keeps
# those machines bootable.
installEFIFallback: true

# BIOS-only installs already get GRUB via the `fw_type != "efi"` path; a hybrid
# install would additionally write a BIOS GRUB onto an EFI system, which is not
# what PhaethonOS ships.
installHybridGRUB: false
