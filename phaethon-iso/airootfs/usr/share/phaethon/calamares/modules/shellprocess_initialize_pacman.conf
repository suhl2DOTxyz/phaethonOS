#
# shellprocess@initialize_pacman -- runs on the LIVE system, immediately before
# pacstrap.
#
# The ISO's pacman.conf uses `SigLevel = Required DatabaseOptional` for
# [core]/[extra], so pacstrap cannot install anything until the live keyring is
# initialised and populated.
#
# THE PRIMARY FIX IS pacman-init.service, NOT THIS FILE. Installing
# archlinux-keyring/cachyos-keyring only drops key material in
# /usr/share/pacman/keyrings; it never builds the trust database pacman reads.
# The live ISO therefore booted with a keyring that produced
# "Public keyring not found; have you run 'pacman-key --init'?" on any pacman
# operation. That is now done at boot by pacman-init.service, copied from
# archiso's releng profile, so it is already finished long before Calamares
# starts and a failure is visible while the disk is still intact.
#
# This step stays as belt-and-braces -- pacman-key --init is idempotent and
# re-running costs a couple of seconds -- but note it executes AFTER the
# partition module, so anything it discovers is discovered on a wiped disk.
---
dontChroot: true

# Keyring population plus a full database refresh over a slow link.
timeout: 900
verbose: true

script:
    # NOT prefixed with '-': if the keyring cannot be built, every single
    # package pacstrap fetches will fail signature verification a minute later
    # with a far more confusing error. Failing here names the actual cause.
    #
    # Bare `--populate` imports every keyring present under
    # /usr/share/pacman/keyrings (archlinux and cachyos both), which is what
    # upstream does; naming them individually just risks missing one that gets
    # added to packages.x86_64 later.
    - '/usr/bin/pacman-key --init'
    - '/usr/bin/pacman-key --populate'

    # Refresh the databases so pacstrap resolves against current mirrors
    # instead of whatever was baked into the ISO at build time. Tolerant: a
    # mirror that is briefly unreachable should not abort the install, since
    # pacstrap will retry the sync itself.
    - '-/usr/bin/pacman -Sy --noconfirm'
