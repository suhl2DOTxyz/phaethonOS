#
# shellprocess@initialize_pacman -- runs on the LIVE system, immediately before
# pacstrap.
#
# The ISO's pacman.conf uses `SigLevel = Required DatabaseOptional` for
# [core]/[extra], so pacstrap cannot install anything until the live keyring is
# initialised and populated. Squashfs ships /etc/pacman.d/gnupg read-only-ish
# and it is cheap to (re)build it here rather than discover the problem
# half-way through the base install.
---
dontChroot: true

# Keyring population plus a full database refresh over a slow link.
timeout: 900
verbose: true

script:
    # `pacman-key --init` is idempotent; it only creates what is missing.
    - '-/usr/bin/pacman-key --init'
    - '-/usr/bin/pacman-key --populate archlinux'
    - '-/usr/bin/pacman-key --populate cachyos'

    # Refresh the databases so pacstrap resolves against current mirrors
    # instead of whatever was baked into the ISO at build time.
    - '-/usr/bin/pacman -Sy --noconfirm'
