#
# packagechooser@desktop -- "which desktop?" page.
#
# `method: packages` here (unlike the bootloader instance): the selected item's
# `packages` list is pushed onto Global Storage's packageOperations, and
# packages@online installs it into the target later in the exec sequence.
#
# A CONSEQUENCE OF THAT METHOD: it writes no Global Storage key (see
# packagechooser/Config.cpp -- only `legacy` calls insert(make_gs_key(...))),
# so nothing downstream can branch on which desktop was picked. That is fine
# because the displaymanager module does not need telling: it scans the target
# for known session binaries (/usr/bin/startplasma-wayland, /usr/bin/gnome-session,
# /usr/bin/startxfce4, /usr/bin/cinnamon-session-cinnamon ... main.py:166-187)
# and configures whichever it finds. displaymanager.conf's
# `defaultDesktopEnvironment` is only the fallback for when that scan comes up
# empty.
#
# EVERY OPTION SHIPS SDDM ON PURPOSE. Not because the others are unsupported,
# but because displaymanager.conf lists sddm alone: the module configures the
# first display manager from that list which is actually installed, so
# installing gdm or lightdm instead would leave the target with a display
# manager nobody configured and no graphical login. sddm happily lists GNOME,
# Xfce and Cinnamon sessions alongside Plasma, so one greeter covers all four.
# sddm is in every list because `displaymanager` configures a display manager,
# it does not install one.
#
# THE PHAETHONOS LOOK IS PLASMA-SPECIFIC. The branding carried by
# shellprocess@branding -- kdeglobals, breezerc, kwinrc, the SDDM theming,
# phaethon-init.sh -- is all KDE configuration. Pick GNOME, Xfce or Cinnamon
# and you get that desktop's stock appearance with the PhaethonOS wallpaper and
# nothing else. The descriptions below say so rather than letting someone find
# out after a 20-minute install.
---
mode: required
method: packages

default: plasma-full

labels:
    step: "Desktop"

items:
    - id: plasma-full
      name: "KDE Plasma (recommended)"
      description: "The full PhaethonOS desktop: Plasma on Wayland with SDDM, the standard KDE applications, and the portal and theming integration the PhaethonOS look depends on. This is the only option that gets the complete PhaethonOS appearance."
      screenshot: "/usr/share/calamares/branding/phaethon/phaethon-logo.png"
      packages:
        - plasma-desktop
        - plasma-wayland-protocols
        - kwin
        - sddm
        - sddm-kcm
        - systemsettings
        - plasma-nm
        - plasma-pa
        - plasma-systemmonitor
        - powerdevil
        - xdg-desktop-portal-kde
        - xdg-user-dirs
        - xdg-utils
        - konsole
        - dolphin
        - dolphin-plugins
        - ark
        - kcalc
        - spectacle
        - gwenview
        - okular
        - qt6-wayland

    - id: plasma-minimal
      name: "KDE Plasma (minimal)"
      description: "Plasma, SDDM, a file manager and a terminal, and nothing else. Leaves you to install the rest yourself -- a smaller download and a smaller install. Still fully themed."
      screenshot: "/usr/share/calamares/branding/phaethon/phaethon-logo.png"
      packages:
        - plasma-desktop
        - plasma-wayland-protocols
        - kwin
        - sddm
        - systemsettings
        - plasma-nm
        - plasma-pa
        - powerdevil
        - xdg-desktop-portal-kde
        - xdg-user-dirs
        - xdg-utils
        - konsole
        - dolphin
        - qt6-wayland

    - id: gnome
      name: "GNOME"
      description: "GNOME Shell on Wayland with SDDM. A clean, opinionated desktop that works well out of the box. Note that the PhaethonOS theming is KDE configuration, so this gets stock GNOME with the PhaethonOS wallpaper."
      screenshot: "/usr/share/calamares/branding/phaethon/phaethon-logo.png"
      packages:
        - gnome-shell
        - gnome-control-center
        - gnome-tweaks
        - gnome-keyring
        - gnome-backgrounds
        - gnome-system-monitor
        - gnome-text-editor
        - gnome-terminal
        - gnome-disk-utility
        - nautilus
        - file-roller
        - loupe
        - evince
        - xdg-desktop-portal-gnome
        - xdg-user-dirs-gtk
        - xdg-utils
        - sddm
        - qt6-wayland

    - id: xfce
      name: "Xfce"
      description: "A light, conventional desktop on X11 with SDDM. The least demanding option here and the friendliest to old or virtualised hardware. Stock Xfce appearance -- the PhaethonOS theming does not apply."
      screenshot: "/usr/share/calamares/branding/phaethon/phaethon-logo.png"
      packages:
        - xfce4-session
        - xfwm4
        - xfdesktop
        - xfce4-panel
        - xfce4-settings
        - xfce4-terminal
        - xfce4-appfinder
        - xfce4-power-manager
        - xfce4-notifyd
        - xfce4-screenshooter
        - xfce4-taskmanager
        - thunar
        - thunar-volman
        - thunar-archive-plugin
        - tumbler
        - garcon
        - exo
        - mousepad
        - ristretto
        - network-manager-applet
        - xdg-desktop-portal-gtk
        - xdg-user-dirs-gtk
        - xdg-utils
        # Xfce is X11 only -- without an X server there is nothing for SDDM to
        # start a session on.
        - xorg-server
        - xorg-xinit
        - sddm

    - id: cinnamon
      name: "Cinnamon"
      description: "A traditional desktop on X11 with SDDM: menu, panel, and a windows-like layout. Familiar if you are coming from Windows. Stock Cinnamon appearance -- the PhaethonOS theming does not apply."
      screenshot: "/usr/share/calamares/branding/phaethon/phaethon-logo.png"
      packages:
        - cinnamon
        - cinnamon-translations
        - nemo
        - nemo-fileroller
        - xed
        - xreader
        - xviewer
        - gnome-terminal
        - gnome-keyring
        - gnome-system-monitor
        - network-manager-applet
        - xdg-desktop-portal-xapp
        - xdg-user-dirs-gtk
        - xdg-utils
        - xorg-server
        - xorg-xinit
        - sddm
