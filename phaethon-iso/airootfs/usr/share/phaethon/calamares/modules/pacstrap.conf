#
# pacstrap -- installs the base system into the mounted target.
#
# This module ships with cachyos-calamares, not upstream Calamares. PR #1
# guessed its schema and guessed wrong: it read `packages:`, and the module
# wants `basePackages:`. The install died on the first screen after Summary
# with
#
#     Package List Missing
#     Cannot continue without list of packages to install
#
# which is src/modules/pacstrap/main.py:90 -- the module returns that when
# "basePackages" is not in its configuration. `kernel:` was invented too;
# pacstrap.schema.yaml sets `additionalProperties: false` and allows exactly
# two keys, basePackages and postInstallFiles.
#
# Source of truth: https://github.com/CachyOS/cachyos-calamares (NOT
# CachyOS/calamares, which is a plain upstream mirror with no pacstrap or chwd
# module at all -- that wrong repo is why the schema was guessed in the first
# place).
#
# WHAT THE MODULE ADDS BY ITSELF -- do not duplicate these here:
#
#   * bootloader packages, keyed off the globalstorage value written by
#     packagechooser@bootloader:
#       grub          -> grub, grub-hook, cachyos-grub-theme, os-prober
#       limine        -> limine, limine-entry-tool
#       systemd-boot  -> systemd-boot-manager
#       refind        -> refind
#     Listing `grub` here would install GRUB even for someone who picked
#     limine, so it is deliberately absent.
#
#   * microcode, from /proc/cpuinfo -- intel-ucode or amd-ucode, whichever the
#     CPU actually needs, rather than both.
#
#   * filesystem extras, from the root filesystem it finds mounted:
#       btrfs + grub   -> snapper, btrfs-assistant, grub-btrfs-support
#       btrfs + limine -> snapper, btrfs-assistant, limine-snapper-sync
#       zfs            -> zfs-utils, linux-cachyos-zfs, linux-cachyos-lts-zfs
#       bcachefs       -> bcachefs-tools, bcachefs-dkms
#
# The module also aborts if globalstorage has no "packagechooser_bootloader",
# which is why packagechooser_bootloader.conf must stay on `method: legacy`.
#
# Keep this list to what a bootable chroot needs. The desktop, drivers and
# applications arrive afterwards via packagechooser@desktop and packages@online
# from netinstall.conf.
---
basePackages:
    # Base system. base-devel is here because netinstall offers yay and paru,
    # and an AUR helper without a toolchain is decoration.
    - base
    - base-devel
    - sudo
    - bash-completion

    # Kernel. linux-cachyos is the whole point of building on the CachyOS
    # repos; the headers are needed for any DKMS module (NVIDIA, VirtualBox).
    - linux-cachyos
    - linux-cachyos-headers
    - linux-firmware

    # initramfs generation. The `initcpio` module runs mkinitcpio against the
    # config `initcpiocfg` writes, so this has to be present before then.
    - mkinitcpio

    # The CachyOS repos have to keep working inside the target, or
    # packages@online cannot install anything from them.
    - cachyos-keyring
    - cachyos-mirrorlist

    # EFI variable management. Every bootloader path that touches the ESP
    # needs it, so it is not left to the per-bootloader lists above.
    - efibootmgr

    # Filesystem tools -- needed inside the chroot for fsck and for mkinitcpio
    # to pick up the right hooks.
    - btrfs-progs
    - dosfstools
    - e2fsprogs
    - xfsprogs
    - cryptsetup
    - device-mapper
    - lvm2

    # Networking, so the installed system can reach the network on first boot
    # even if packages@online is interrupted.
    - networkmanager

    # users.conf sets this as the new user's login shell.
    - fish

# Files copied from the LIVE system into the target after pacstrap finishes.
# Missing entries are skipped with a warning (main.py checks os.path.exists),
# so this cannot break an install, but there is no reason to name files this
# ISO does not carry.
#
# The module appends /etc/default/grub to this list by itself when GRUB was
# chosen, which is harmless: grubcfg rewrites that file later in the sequence.
# Deliberately empty. Upstream CachyOS copies /etc/mkinitcpio.conf and a set of
# helper scripts under /etc/calamares/scripts, none of which apply here:
#
#   * /etc/mkinitcpio.conf -- the target gets its own from the mkinitcpio
#     package, and initcpiocfg rewrites HOOKS and MODULES in it later in the
#     sequence anyway, so copying the live one adds nothing and risks dragging
#     archiso's configuration across. (Only a risk, not a live bug: archiso
#     keeps its hooks in the /etc/mkinitcpio.conf.d/archiso.conf drop-in, which
#     is not copied, so the ISO's mkinitcpio.conf is the stock file.)
#   * CachyOS's dmcheck/remove-nvidia/enable-ufw scripts -- this profile does
#     its own equivalent work in shellprocess@branding and
#     shellprocess@enable_ufw.
#
# pacman.conf, the mirrorlist and the keyring are already carried into the
# target by shellprocess@before-online, which runs before this module.
postInstallFiles: []
