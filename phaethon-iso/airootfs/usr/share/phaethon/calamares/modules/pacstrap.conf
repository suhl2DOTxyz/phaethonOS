# SPDX-License-Identifier: CC0-1.0
#
# pacstrap -- installs the base system into the mounted target.
#
# Like `chwd`, this module comes from the `cachyos-calamares` package rather
# than upstream Calamares, and its configuration schema is not published
# anywhere reachable. The `packages` key below is the module's documented
# behaviour (the list handed to pacstrap); unrecognised keys are ignored by
# Calamares modules, so a mismatch here degrades rather than breaks.
#
# It degrades safely because this list is deliberately minimal -- just enough
# for a working chroot with a kernel and a bootloader. Everything else
# (desktop, drivers, applications) is installed afterwards by packages@online
# from netinstall.conf and packagechooser@desktop, so even if this module falls
# back to its own built-in default the resulting system is still complete.
#
# shellprocess@before-online has already put a pacman.conf, a mirrorlist and
# the populated keyring into the target by the time this runs.
---
packages:
    # Base system
    - base
    - systemd-sysvcompat
    - sudo
    - bash-completion

    # Kernel. linux-cachyos is the whole point of building on the CachyOS
    # repos; the headers are needed for any DKMS module (NVIDIA, VirtualBox).
    - linux-cachyos
    - linux-cachyos-headers
    - linux-firmware
    - intel-ucode
    - amd-ucode

    # initramfs generation. The `initcpio` module runs mkinitcpio against the
    # config that `initcpiocfg` writes, so this has to be present before then.
    - mkinitcpio

    # Bootloader. packagechooser@bootloader only records *which* bootloader to
    # install, it does not install packages (see packagechooser_bootloader.conf),
    # so both sets go in here.
    - grub
    - efibootmgr
    - os-prober

    # Filesystem tools -- needed inside the chroot for fsck and for mkinitcpio
    # to pick up the right hooks.
    - btrfs-progs
    - dosfstools
    - e2fsprogs
    - xfsprogs
    - cryptsetup
    - lvm2

    # Networking, so the installed system can reach the network on first boot
    # even if packages@online is interrupted.
    - networkmanager

    # users.conf sets this as the new user's login shell.
    - fish

# The kernel to build the initramfs for. Kept in step with the linux-cachyos
# entry above and with phaethon-iso/packages.x86_64.
kernel: linux-cachyos
