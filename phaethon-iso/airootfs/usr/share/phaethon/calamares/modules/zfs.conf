#
# Creates the zpool and datasets when the user partitions onto ZFS.
#
# This module sits in the exec sequence unconditionally but does nothing unless
# a ZFS filesystem was actually chosen on the partitioning page. Note that
# phaethon-iso/packages.x86_64 does not currently ship zfs-utils, so ZFS is not
# selectable on the stock ISO -- this configuration is here so the sequence is
# complete and so ZFS works the moment zfs-utils is added to the manifest.
---
poolName: phaethon

# ashift=12 for 4K-sector drives, mountpoint=none because Calamares mounts the
# datasets itself, posixacl because systemd-journald requires it.
#
# Encryption options do not belong here -- they are added automatically when
# the encrypt-disk option is used on the partitioning page.
poolOptions: "-f -o ashift=12 -O mountpoint=none -O acltype=posixacl -O relatime=on"

# Applied to every dataset below. canmount/mountpoint are set per-dataset.
datasetOptions: "-o compression=zstd -o atime=off -o xattr=sa"

# The boot-environment layout: ROOT/phaethon/* keeps this install's datasets
# together, so a second distro can be installed into the same pool later
# without collisions.
datasets:
    - dsName: ROOT
      mountpoint: none
      canMount: off
    - dsName: ROOT/phaethon
      mountpoint: none
      canMount: off
    - dsName: ROOT/phaethon/root
      mountpoint: /
      canMount: noauto
    - dsName: ROOT/phaethon/home
      mountpoint: /home
      canMount: on
    - dsName: ROOT/phaethon/varcache
      mountpoint: /var/cache
      canMount: on
    - dsName: ROOT/phaethon/varlog
      mountpoint: /var/log
      canMount: on
