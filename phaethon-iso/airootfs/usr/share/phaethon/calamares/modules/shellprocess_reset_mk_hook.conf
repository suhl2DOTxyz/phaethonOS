#
# shellprocess@reset_mk_hook -- runs INSIDE the target, after `bootloader`.
#
# Undoes the target-side half of shellprocess@modify_mk_hook. By this point
# initcpiocfg has written /etc/mkinitcpio.conf, `initcpio` has generated the
# real initramfs, and `bootloader` has installed and configured GRUB -- so
# mkinitcpio's alpm hooks can be handed back to pacman. If they were left
# masked, the installed system would silently stop regenerating its initramfs
# on the next kernel upgrade and would eventually fail to boot.
#
# The live-side hook is deliberately not restored: the live system is
# discarded at reboot, and this step cannot reach outside the chroot anyway.
---
dontChroot: false
timeout: 60
verbose: true

script:
    # Unmask mkinitcpio for the installed system's future kernel upgrades.
    - '-/usr/bin/rm -f /etc/pacman.d/hooks/90-mkinitcpio-install.hook'
    - '-/usr/bin/rm -f /etc/pacman.d/hooks/60-mkinitcpio-remove.hook'

    # Belt and braces: if anything ever copies the live /etc wholesale into the
    # target, these two files would give the installed system an archiso
    # initramfs, which cannot boot from a real disk.
    - '-/usr/bin/rm -f /etc/pacman.d/hooks/archiso-rebuild.hook'
    - '-/usr/bin/rm -f /etc/pacman.d/hooks/archiso-rebuild.hook.disabled'
    - '-/usr/bin/rm -f /etc/mkinitcpio.conf.d/archiso.conf'

    # Leave no empty directory shadowing /usr/share/libalpm/hooks.
    - '-/usr/bin/rmdir --ignore-fail-on-non-empty /etc/pacman.d/hooks'
