#
# "Package selection" page.
#
# Selections here are pushed onto Global Storage's packageOperations and
# installed by packages@online, which runs after pacstrap.
#
# The desktop itself is NOT here -- it comes from packagechooser@desktop, so
# that page and this one cannot disagree about which Plasma you get.
#
# This mirrors phaethon-iso/packages.x86_64, which is the live ISO's manifest.
# The two are separate lists on purpose: the ISO needs the installer and the
# live session, the installed system needs neither.
---
# Groups are defined inline below rather than fetched over the network -- one
# less thing that can fail mid-install.
groupsUrl: local

# The Core System group is critical, so it is effectively required anyway;
# leaving this false means an unreachable *optional* package cannot abort an
# otherwise fine install.
required: false

label:
    sidebar: "Packages"
    title: "Package selection"

groups:
    # --- Not shown to the user, cannot be deselected -------------------------
    - name: "Core System"
      description: "The base PhaethonOS system"
      hidden: true
      selected: true
      # critical: a failure to install any of these fails the installation,
      # rather than quietly producing a system that does not boot.
      critical: true
      immutable: true
      packages:
        - base
        - linux-cachyos
        - linux-cachyos-headers
        - linux-firmware
        - sof-firmware
        - intel-ucode
        - amd-ucode
        - mkinitcpio
        - systemd-sysvcompat
        - networkmanager
        - networkmanager-openvpn
        - wpa_supplicant
        - iwd
        - bluez
        - bluez-utils
        - wireless-regdb
        - sudo
        - grub
        - efibootmgr
        - os-prober
        - cryptsetup
        - btrfs-progs
        - dosfstools
        - e2fsprogs
        - xfsprogs
        - reflector
        - firewalld
        - apparmor
        # Enabled by services-systemd.conf and advertised by the welcome
        # dashboard, so they have to actually be installed.
        - ananicy-cpp
        - zram-generator
        - bash-completion
        - git
        - wget
        - curl
        - rsync
        - cachyos-keyring
        - cachyos-mirrorlist
        # users.conf sets /usr/bin/fish as the new user's login shell, so this
        # is not optional -- without it the first login drops to nothing.
        - fish

    - name: "Graphics drivers"
      description: "Open-source AMD and Intel drivers plus the Vulkan stack. Harmless on machines without matching hardware."
      hidden: true
      selected: true
      critical: true
      packages:
        - mesa
        - lib32-mesa
        - xf86-video-amdgpu
        - vulkan-radeon
        - lib32-vulkan-radeon
        - vulkan-intel
        - lib32-vulkan-intel
        - vulkan-mesa-layers
        - lib32-vulkan-mesa-layers
        - libva-mesa-driver
        - lib32-libva-mesa-driver

    - name: "Audio"
      description: "PipeWire audio stack"
      hidden: true
      selected: true
      critical: true
      packages:
        - pipewire
        - pipewire-alsa
        - pipewire-pulse
        - pipewire-jack
        - wireplumber

    - name: "Fonts"
      description: "Default font set"
      hidden: true
      selected: true
      critical: true
      packages:
        # Not cosmetic: the skeleton's kdeglobals sets the Plasma UI font to
        # Inter, so without this the installed desktop falls back to a default
        # font and stops matching the design.
        - inter-font
        - cantarell-fonts
        - ttf-dejavu
        - noto-fonts
        - noto-fonts-emoji

    # --- Shown to the user ---------------------------------------------------
    - name: "PhaethonOS extras"
      description: "The PhaethonOS welcome dashboard and Flatpak support."
      selected: true
      packages:
        - electron
        - flatpak
        - discover
        - xdg-desktop-portal-kde

    - name: "Internet and productivity"
      description: "Firefox, Thunderbird, LibreOffice and VLC."
      selected: true
      packages:
        - firefox
        - thunderbird
        - libreoffice-fresh
        - vlc

    - name: "Gaming"
      description: "Steam, Lutris, GameMode and MangoHud. Pulls in a fair amount of 32-bit multilib."
      selected: true
      packages:
        - steam
        - lutris
        - mangohud
        - lib32-mangohud
        - goverlay
        - gamemode
        - lib32-gamemode
        - discord

    - name: "Development"
      description: "Editors, containers and a compiler toolchain."
      selected: true
      subgroups:
        - name: "Editors and terminals"
          description: "VS Code, Neovim, Ghostty and fastfetch."
          selected: true
          packages:
            - code
            - neovim
            - ghostty
            - fastfetch
            - python-gobject

        - name: "Containers"
          description: "Docker and Docker Compose. The first user is added to the docker group."
          selected: false
          packages:
            - docker
            - docker-compose

        - name: "Build toolchain"
          description: "The compilers and tools needed to build software from source, including AUR packages."
          selected: true
          packages:
            - autoconf
            - automake
            - binutils
            - bison
            - fakeroot
            - file
            - findutils
            - flex
            - gawk
            - gcc
            - gettext
            - grep
            - groff
            - gzip
            - libtool
            - m4
            - make
            - patch
            - pkgconf
            - sed
            - texinfo
            - which

    - name: "AUR helpers"
      description: "yay and paru, for installing from the Arch User Repository."
      selected: true
      packages:
        - yay
        - paru
