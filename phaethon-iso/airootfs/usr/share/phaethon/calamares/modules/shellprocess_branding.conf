#
# shellprocess@branding -- installs the PhaethonOS look onto the target.
#
# WHY THIS EXISTS: none of the PhaethonOS theming is packaged. It all lives in
# the ISO's airootfs overlay, and `pacstrap` installs a fresh system rather
# than copying the live /etc, so without this step the installed machine comes
# up as stock Arch + Plasma -- default wallpaper, default colours, no fish
# prompt, no welcome dashboard -- while only the live session looks like
# PhaethonOS.
#
# WHY IT SITS WHERE IT DOES: the `users` module creates the account with
# `useradd -m`, which copies /etc/skel into the new home. Anything landing in
# the target's /etc/skel after that point never reaches the user. So this runs
# immediately before `users` -- and after packages@online, so Plasma's own
# directories already exist to drop the colour scheme and wallpaper into.
#
# FAILURE POLICY: cosmetics are tolerant, correctness is not.
#
# This step runs AFTER the partition module has already repartitioned the disk.
# Aborting an install at this point leaves the user with a wiped drive and no
# system, so "the wallpaper failed to copy" must never be able to do that --
# they would lose a working machine over a background image.
#
# So the theming commands below are "-" prefixed and merely log on failure. The
# few that are genuinely load-bearing stay hard: the helper scripts the desktop
# autostart entries invoke, and the skel copy itself, because a half-populated
# /etc/skel is worse than an obviously unstyled one and is silently inherited by
# every user created afterwards.
---
dontChroot: true
timeout: 300
verbose: true

script:
    # --- Plasma theme assets -------------------------------------------------
    # phaethon-init.sh (autostarted from skel) calls plasma-apply-colorscheme
    # and plasma-apply-wallpaperimage against exactly these two paths.
    - '-/usr/bin/install -d -m 0755 ${ROOT}/usr/share/color-schemes'
    - '-/usr/bin/install -m 0644 /usr/share/color-schemes/PhaethonDark.colors ${ROOT}/usr/share/color-schemes/PhaethonDark.colors'
    - '-/usr/bin/install -d -m 0755 ${ROOT}/usr/share/wallpapers'
    - '-/usr/bin/cp -aT /usr/share/wallpapers/phaethon ${ROOT}/usr/share/wallpapers/phaethon'

    # --- Branding assets -----------------------------------------------------
    # phaethon-logo.png is the icon for both desktop launchers; logo.txt is the
    # ASCII art the skel fastfetch config renders next to the system info.
    # pacman.conf.target is deliberately not copied -- it is an installer input,
    # not something the installed system needs a second copy of.
    - '-/usr/bin/install -d -m 0755 ${ROOT}/usr/share/phaethon'
    - '-/usr/bin/install -m 0644 /usr/share/phaethon/phaethon-logo.png ${ROOT}/usr/share/phaethon/phaethon-logo.png'
    - '-/usr/bin/install -m 0644 /usr/share/phaethon/logo.txt ${ROOT}/usr/share/phaethon/logo.txt'

    # --- Helper scripts ------------------------------------------------------
    # Only the two that make sense off the ISO. phaethon-calamares,
    # phaethon-fix-libs.sh, choose-mirror, livecd-sound and Installation_guide
    # are live-session tooling and stay behind.
    - '/usr/bin/install -D -m 0755 /usr/local/bin/phaethon-init.sh ${ROOT}/usr/local/bin/phaethon-init.sh'
    - '/usr/bin/install -D -m 0755 /usr/local/bin/phaethon-welcome ${ROOT}/usr/local/bin/phaethon-welcome'
    - '/usr/bin/install -D -m 0755 /usr/local/bin/phaethon-welcome-firstrun ${ROOT}/usr/local/bin/phaethon-welcome-firstrun'

    # --- Welcome dashboard ---------------------------------------------------
    # Needs `electron`, which netinstall's "PhaethonOS extras" group installs.
    - '-/usr/bin/cp -aT /usr/share/phaethon-welcome-app ${ROOT}/usr/share/phaethon-welcome-app'

    # --- Skeleton ------------------------------------------------------------
    # The whole point: kdeglobals, kwinrc, breezerc, the fish prompt, the
    # fastfetch config and the autostart entries. `cp -aT` merges into the
    # /etc/skel the `filesystem` package already provides rather than replacing
    # it, so .bashrc and friends survive.
    - '/usr/bin/cp -aT /etc/skel ${ROOT}/etc/skel'

    # The system-wide Plasma defaults, as opposed to the per-user copies in
    # /etc/skel above. These matter separately: /etc/xdg applies to the SDDM
    # greeter and to any account created after the install, whereas skel only
    # ever reaches the first user Calamares creates.
    - '-/usr/bin/install -d -m 0755 ${ROOT}/etc/xdg'
    - '-/usr/bin/cp -aT /etc/xdg ${ROOT}/etc/xdg'

    # The installer's own launcher is live-session only.
    - '/usr/bin/rm -f ${ROOT}/etc/skel/Desktop/calamares.desktop'

    # Swap the welcome dashboard's autostart entry for the one-shot variant --
    # on a live ISO every boot is a first boot, on an installed system it should
    # open once and then get out of the way. See phaethon-welcome-firstrun.
    - '/usr/bin/install -m 0644 /usr/share/phaethon/phaethon-welcome-firstrun.desktop ${ROOT}/etc/skel/.config/autostart/phaethon-welcome.desktop'

    # --- System tuning -------------------------------------------------------
    # Same overlay-only problem as the theming above: these live in the ISO's
    # airootfs, and pacstrap builds a fresh system rather than copying the live
    # /etc, so without this the installed machine silently loses every
    # PhaethonOS performance tweak and boots with stock kernel defaults.
    #
    # The welcome dashboard now probes for exactly these, so a missing copy also
    # makes it report ZRAM and Ananicy as "NOT INSTALLED" on a fresh install.
    - '-/usr/bin/install -D -m 0644 /etc/sysctl.d/99-phaethon.conf ${ROOT}/etc/sysctl.d/99-phaethon.conf'
    - '-/usr/bin/install -D -m 0644 /etc/systemd/zram-generator.conf ${ROOT}/etc/systemd/zram-generator.conf'
    - '-/usr/bin/install -d -m 0755 ${ROOT}/etc/ananicy.d'
    - '-/usr/bin/cp -aT /etc/ananicy.d ${ROOT}/etc/ananicy.d'

    # --- Login screen --------------------------------------------------------
    # welcome.conf carries the SDDM greeting text. autologin.conf is pointedly
    # NOT copied: it logs the live `live` user straight in with no password.
    - '-/usr/bin/install -d -m 0755 ${ROOT}/etc/sddm.conf.d'
    - '-/usr/bin/install -m 0644 /etc/sddm.conf.d/welcome.conf ${ROOT}/etc/sddm.conf.d/welcome.conf'
