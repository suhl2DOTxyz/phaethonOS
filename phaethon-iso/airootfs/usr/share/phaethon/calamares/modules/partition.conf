#
# Disk partitioning page.
---
efi:
    # GRUB convention. The kernel and initramfs live on the root filesystem
    # under /boot, so the ESP only ever holds the EFI binaries themselves.
    mountPoint:      "/boot/efi"
    recommendedSize: 512MiB
    # FAT32 cannot be created below ~256MiB, and some firmware refuses smaller.
    minimumSize:     260MiB
    label:           "PHAETHON_EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file

# A swap file, on btrfs, in a dedicated subvolume (see mount.conf's
# btrfsSwapSubvol). Resizable after install, unlike a swap partition.
initialSwapChoice: file

# Nothing pre-selected. Plenty of installers default to "Erase disk", which
# means someone clicking Next through the wizard wipes their drive without ever
# making the choice. Make them pick.
initialPartitioningChoice: none

defaultFileSystemType: "btrfs"
availableFileSystemTypes:
    - btrfs
    - ext4
    - xfs
    - f2fs

# luks1, not luks2. GRUB 2.12 can only unlock LUKS2 volumes whose key
# derivation is PBKDF2, and cryptsetup defaults LUKS2 to Argon2id -- so a LUKS2
# root with /boot inside it produces a system GRUB cannot open. luks1 keeps
# encrypted installs bootable.
luksGeneration: luks1
enableLuksAutomatedPartitioning: true

allowManualPartitioning: true
drawNestedPartitions: false
alwaysShowPartitionLabels: true

# Matches welcome_online.conf's requiredStorage.
requiredStorage: 25.0

# Device-mapper names that must not be closed while the installer runs --
# doing so pulls the live filesystem out from under it. "ventoy" covers ISOs
# booted from a Ventoy stick.
essentialMounts: [ "live-*", "control", "ventoy" ]

lvm:
    enable: true
