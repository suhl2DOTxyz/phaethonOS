#
# packagechooser@bootloader -- "which bootloader?" page.
#
# `method: legacy` (NOT `packages`) is deliberate and load-bearing.
#
# With `method: legacy` the module writes the selected item's id into Global
# Storage under a key named after the *instance id* from settings.conf, i.e.
# `packagechooser_bootloader`. bootloader.conf reads exactly that key via
# `efiBootLoaderVar`, which is what makes this page actually change which
# bootloader gets installed.
#
# `method: packages` would instead push package names onto packageOperations
# and write no Global Storage value at all -- bootloader.conf's
# `efiBootLoaderVar` lookup would miss, the module would log a warning and
# install *no bootloader whatsoever*. The bootloader packages themselves come
# from pacstrap.conf's base list instead.
#
# The item ids are not free-form: the bootloader module only understands
# "grub", "systemd-boot", "sb-shim", "refind", "clr-boot-manager" and "none".
---
mode: required
method: legacy

# Guarantees a value always lands in Global Storage, so the bootloader module
# can never come up empty.
default: grub

labels:
    step: "Bootloader"

items:
    - id: grub
      name: "GRUB"
      description: "The PhaethonOS default. Boots BIOS and UEFI systems alike, detects other operating systems already on the disk, and carries the PhaethonOS boot theme. Pick this unless you have a specific reason not to."
      screenshot: "/usr/share/calamares/branding/phaethon/phaethon-logo.png"

    - id: systemd-boot
      name: "systemd-boot"
      description: "A minimal UEFI-only boot manager. Faster and simpler than GRUB, but it cannot boot on BIOS systems, will not detect other installed operating systems, and does not support the PhaethonOS boot theme."
      screenshot: "/usr/share/calamares/branding/phaethon/phaethon-logo.png"
