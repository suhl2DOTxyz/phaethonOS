#
# User account creation page.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - power
    - input
    - audio
    # Lets the first user manage containers without sudo. The group is created
    # by the docker package; must_exist is false so a Development-less install
    # does not fail here.
    - name: docker
      must_exist: false
      system: true

sudoersGroup: wheel

# Write a real sudoers drop-in for `wheel` rather than relying on the
# passwordless live-session rule, which the bare shellprocess step deletes.
sudoersConfigureWithGroup: true

autologinGroup: autologin

setRootPassword: true
doReusePassword: false

# Autologin is offered but off by default: a machine that logs itself in has
# no meaningful login security.
displayAutologin: true
doAutologin: false

passwordRequirements:
    minLength: 6
    maxLength: -1
    libpwquality:
        - minlen=6
        - minclass=2

# Weak passwords are allowed but warned about -- refusing them outright drives
# people to write passwords down.
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
    # Matches the live session: create-live-user.service gives the `live` user
    # /usr/bin/fish, and /etc/skel ships a fish config. netinstall keeps fish in
    # the critical Core System group so this shell always exists.
    shell: /usr/bin/fish
    forbidden_names: [ root, live ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "phaethon-${product}"
    forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        editable: true
    loginName:
        editable: true
